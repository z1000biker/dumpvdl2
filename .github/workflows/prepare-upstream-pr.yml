name: Prepare upstream Windows PR branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-upstream-pr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save Windows patch helper
        run: cp ci/patch_dumpvdl2_windows.py "$RUNNER_TEMP/patch_dumpvdl2_windows.py"

      - name: Base branch on upstream devel
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/szpajder/dumpvdl2.git
          git fetch upstream devel
          git checkout -B windows-x64-support upstream/devel

      - name: Apply Windows compatibility changes
        run: python3 "$RUNNER_TEMP/patch_dumpvdl2_windows.py"

      - name: Add Windows CI
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/build-windows-x64.yml <<'YAML'
          name: Windows x64

          on:
            push:
              branches: [windows-x64-support]
            pull_request:

          jobs:
            build-windows:
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@v4

                - name: Set up MSYS2 UCRT64
                  uses: msys2/setup-msys2@v2
                  with:
                    msystem: UCRT64
                    update: true
                    install: >-
                      git
                      make
                    pacboy: >-
                      toolchain:p
                      cmake:p
                      ninja:p
                      pkgconf:p
                      glib2:p
                      rtl-sdr:p
                      sqlite3:p
                      zeromq:p
                      protobuf-c:p

                - name: Build libacars 2.2.1
                  shell: msys2 {0}
                  run: |
                    set -euxo pipefail
                    cd "$RUNNER_TEMP"
                    git clone --depth 1 --branch v2.2.1 https://github.com/szpajder/libacars.git
                    cmake -S libacars -B libacars/build -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_INSTALL_PREFIX=/ucrt64
                    cmake --build libacars/build
                    cmake --install libacars/build

                - name: Configure
                  shell: msys2 {0}
                  run: |
                    set -euxo pipefail
                    cmake -S . -B build -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DRTLSDR=TRUE \
                      -DMIRISDR=FALSE \
                      -DSDRPLAY=FALSE \
                      -DSDRPLAY3=FALSE \
                      -DSOAPYSDR=FALSE \
                      -DETSY_STATSD=FALSE \
                      -DSQLITE=TRUE \
                      -DZMQ=TRUE \
                      -DRAW_BINARY_FORMAT=TRUE

                - name: Build
                  shell: msys2 {0}
                  run: cmake --build build -v

                - name: Smoke test
                  shell: msys2 {0}
                  run: ./build/src/dumpvdl2.exe --help
          YAML

      - name: Commit and push clean contribution branch
        run: |
          set -euxo pipefail
          git config user.name "Z1000biker"
          git config user.email "sv1eex.nik@gmail.com"
          git add src/dumpvdl2.c src/kvargs.c src/fmtr-text.c src/idrp.c src/input-raw_frames_file.c src/output-file.c src/output-udp.c src/CMakeLists.txt .github/workflows/build-windows-x64.yml
          git commit -m "Add Windows x64 support"
          git push --force origin HEAD:refs/heads/windows-x64-support
